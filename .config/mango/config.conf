#
# GLOBAL
# https://mangowm.github.io/docs/configuration/miscellaneous
#

auto_reload_config=1
xwayland_persistence=1
xwayland_ignore_scale=1


#
# MONITORS
# https://mangowm.github.io/docs/configuration/monitors
#

monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,primary:1


#
# AUTOSTART
# https://mangowm.github.io/docs/configuration/basics#autostart
#

# core
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=wayle shell
exec_once=awww-daemon

# applications
exec_once=zen-browser
exec_once=Telegram


#
# INPUT
# https://mangowm.github.io/docs/configuration/input
# https://mangowm.github.io/docs/configuration/miscellaneous
#

# keyboard
repeat_rate=35
repeat_delay=250
xkb_rules_layout=us,ru
xkb_rules_options=grp:lalt_lshift_toggle

# mouse
mouse_natural_scrolling=0
mouse_accel_profile=0
sloppy_focus=0
warp_cursor=0


#
# ENVIRONMENT VARIABLES
# https://mangowm.github.io/docs/configuration/basics#environment-variables
#

env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto


#
# LOOK AND FEEL
# https://mangowm.github.io/docs/visuals
# https://mangowm.github.io/docs/configuration/miscellaneous
#

source=./theme.conf

blur=0
shadows=0
animations=0

border_radius=0
border_px=4
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

# cursor
cursor_theme=bibata-modern-ice
cursor_size=24


#
# LAYOUT
# https://mangowm.github.io/docs/window-management/layouts
#

# Overview Setting
enable_hotarea=0
overview_gap_inner=20
overview_gap_outer=20
overcircle_center_ratio=0.5

# Scroller Layout Setting
scroller_structs=0
scroller_default_proportion=0.5
scroller_default_proportion_single=0.5
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=1.0,0.66667,0.5,0.33333


#
# Key Bindings
# https://mangowm.github.io/docs/bindings/keys
#

# bind=SUPER,I,reload_config
bind=SUPER,M,quit
bind=SUPER,Q,killclient

bind=SUPER,T,spawn,kitty
bind=SUPER,E,spawn,thunar
bind=SUPER,B,spawn,zen-browser
bind=SUPER,L,spawn,hyprlock
bind=SUPER,R,spawn,$HOME/.config/scripts/fuzzel/applications.menu.sh
bind=SUPER,P,spawn,$HOME/.config/scripts/fuzzel/power.menu.sh
bind=SUPER,J,spawn,$HOME/.config/scripts/theme.sh
bind=SUPER,U,spawn,kitty -T 'fzf wallpapers' -e $HOME/.config/scripts/fzf/wallpaper.menu.sh

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,F,togglefullscreen
bind=SUPER+SHIFT,F,togglemaximizescreen
bind=SUPER,D,switch_proportion_preset
bind=SUPER,O,togglejump
bind=SUPER,V,togglefloating

# scroller layout
bind=ALT,X,set_proportion,1.0
bind=ALT,C,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# focus workspace
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move to workspace
# tag: move and focus it
# tagsilent: move and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# resizewin
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# mouse buttons
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# mouse wheel
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right


#
# WINDOW & LAYER RULES
# https://mangowm.github.io/docs/window-management/rules
#

tag_rule=id:*,layout_name:scroller
# tag_rule=id:9,layout_name:dwindle

window_rule=app_id:*,allow_csd=0

# bind apps to workspaces
window_rule=app_id:^zen$,tags:1
window_rule=app_id:^org.telegram.desktop$,tags:2

# always proportion 1
window_rule=app_id:^zen$,scroller_proportion:1.0
window_rule=app_id:^firefox$,scroller_proportion:1.0
window_rule=app_id:^helium$,scroller_proportion:1.0
window_rule=app_id:^librewolf$,scroller_proportion:1.0
window_rule=app_id:^Tor Browser$,scroller_proportion:1.0
window_rule=app_id:^org.telegram.desktop$,scroller_proportion:1.0
window_rule=app_id:^code$,scroller_proportion:1.0
window_rule=app_id:^dev.zed.Zed$,scroller_proportion:1.0
window_rule=app_id:^steam$,scroller_proportion:1.0
window_rule=app_id:^heroic$,scroller_proportion:1.0
window_rule=app_id:^discord$,scroller_proportion:1.0

# always floating
window_rule=app_id:^xdg-desktop-portal-.*$,is_floating:1
window_rule=app_id:^thunar$,title:^Rename.*$,is_floating:1
window_rule=app_id:^thunar$,title:^File Operation Progress$,is_floating:1
window_rule=app_id:^blueman-manager$,is_floating:1
window_rule=app_id:^org.telegram.desktop$,title:^Media viewer$,is_floating:1
window_rule=app_id:^org.telegram.desktop$,title:^Mini App:.*$,is_floating:1
window_rule=app_id:^steam$,title:^Friends List$,is_floating:1
window_rule=app_id:^steam$,title:^Steam Settings$,is_floating:1

# always floating fixed size
window_rule=app_id:^xdg-desktop-portal-gtk$,width:800,height:600,is_floating:1
window_rule=app_id:^org.pulseaudio.pavucontrol$,width:800,height:600,is_floating:1
window_rule=app_id:^mpv$,width:800,height:600,is_floating:1
window_rule=app_id:^imv$,width:800,height:600,is_floating:1
window_rule=app_id:^kitty$,title:^fzf wallpapers$,width:800,height:600,is_floating:1

# additional steam
window_rule=app_id:^steam$,title:^notificationtoasts_\d+_desktop$,is_floating:1
window_rule=app_id:^steam_app_.*$,is_floating:0,is_fullscreen:1
